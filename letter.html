<!DOCTYPE html>

<html>
<head>

  <style>
    
    body {
    transition: background 1s ease;
}

/* Starry theme */

body.star-theme {
    background:
        radial-gradient(
            circle at 75% 20%,
            rgba(255,255,220,.25),
            transparent 15%
        ),
        radial-gradient(
            circle at 20% 30%,
            #18255c,
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #050817,
            #101a3d,
            #080b20
        );
}
    
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at 20% 20%, #5e234f, transparent 30%),
        radial-gradient(circle at 80% 80%, #32134f, transparent 35%),
        linear-gradient(135deg, #120815, #301329, #180b25);

    font-family: "Playfair Display", serif;
}


/* =========================
   CARD
========================= */

.card {
    width: 350px;
    height: 520px;

    position: relative;

    perspective: 1500px;

    filter:
        drop-shadow(0 25px 35px rgba(0,0,0,.5));
}


/* =========================
   COVER
========================= */

.cover {
    position: absolute;

    width: 100%;
    height: 100%;

    z-index: 5;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    cursor: pointer;

    transform-origin: left center;

    transition:
        transform 1.5s cubic-bezier(.77,0,.18,1);

    border-radius: 8px;

    background:
        radial-gradient(circle at 50% 40%,
        rgba(255,255,255,.15),
        transparent 30%),
        linear-gradient(
            135deg,
            #65134c,
            #a52d69,
            #54134e
        );

    box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.15),
        inset 0 0 40px rgba(0,0,0,.25);
}


/* Decorative border */

.cover::before {
    content: "";

    position: absolute;

    inset: 15px;

    border: 1px solid rgba(255,255,255,.35);

    border-radius: 5px;
}


/* Cover title */

.cover h1 {
    color: white;

    font-family: "Playfair Display", serif;

    font-size: 42px;

    margin: 15px;

    text-shadow:
        0 0 5px #fff,
        0 0 15px #ff7ac8,
        0 0 30px #ff3fa7;
}

.cover p {
    color: #ffd8ed;

    font-family: "Caveat", cursive;

    font-size: 24px;
}


/* Wax seal */

.seal {
    width: 100px;
    height: 100px;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;

    font-size: 32px;

    background:
        radial-gradient(circle,
        #ff6fae,
        #a71960);

    box-shadow:
        0 5px 15px rgba(0,0,0,.35),
        0 0 20px rgba(255,80,170,.5);

    animation: sealPulse 2s ease-in-out infinite;
}

@keyframes sealPulse {

    50% {
        transform: scale(1.05);
        box-shadow:
            0 5px 15px rgba(0,0,0,.35),
            0 0 30px rgba(255,80,170,.8);
    }

}


/* OPEN */

.card.open .cover {
    transform: rotateY(-165deg);
}


/* =========================
   LETTER PAPER
========================= */

.letter {
    position: absolute;

    width: 100%;
    height: 100%;

    padding: 45px 40px;

    overflow-y: auto;

    color: #4b3440;

    border-radius: 8px;

    background:

        /* paper lines */
        repeating-linear-gradient(
            transparent 0px,
            transparent 31px,
            rgba(130,80,100,.12) 32px
        ),

        /* paper color */
        #fff8ed;

    box-shadow:
        inset 0 0 30px rgba(120,70,40,.12);
    
    scrollbar width: thin;
}

/* Paper edge */

.letter::before {
    content: "";

    position: absolute;

    inset: 12px;

    border: 1px solid rgba(150,90,110,.25);

    pointer-events: none;
}


/* =========================
   LETTER CONTENT
========================= */

.date {
    text-align: right;

    font-family: "Caveat", cursive;

    font-size: 19px;

    color: #87636f;

    margin-bottom: 25px;
}


.letter h2 {
    font-family: "Caveat", cursive;

    font-size: 38px;

    font-weight: 500;

    color: #6e294f;

    margin-bottom: 20px;
}


.letter p {
    font-family: "Caveat", cursive;

    font-size: 23px;

    line-height: 1.45;

    margin: 20px 0;

    text-indent: 25px;
}


/* First paragraph */

.letter p:first-of-type::first-letter {
    font-size: 45px;

    color: #b3326d;

    float: left;

    line-height: .8;

    margin-right: 5px;
}


/* =========================
   DIVIDER
========================= */

.divider {
    text-align: center;

    margin: 30px 0;

    color: #b43b70;

    font-size: 20px;

    letter-spacing: 3px;
}


/* =========================
   ENDING
========================= */

.ending {
    text-align: left;

    text-indent: 0 !important;
}


/* =========================
   SIGNATURE
========================= */

.signature {
    margin-top: 35px;

    text-align: right;

    font-family: "Caveat", cursive;

    font-size: 23px;

    color: #63394d;
}

.signature span {
    font-size: 28px;

    color: #9b3262;
}


/* =========================
   DECORATIONS
========================= */

.letter-decoration {
    position: absolute;

    top: 20px;
    left: 25px;

    font-size: 28px;

    color: #c45b85;

    opacity: .6;
}

.bottom-decoration {
    text-align: center;

    margin-top: 35px;

    color: #bd4779;

    font-size: 20px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .card {
        width: 90vw;
        height: 80vh;
    }

    .letter {
        padding: 40px 30px;
    }

    .letter p {
        font-size: 21px;
    }

}
  
    .rain {
    position: fixed;
    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: -1;
}

.drop {
    position: absolute;

    top: -30px;

    width: 2px;
    height: 25px;

    background: rgba(180, 210, 255, 0.45);

    animation: rainFall linear infinite;
}

@keyframes rainFall {
    to {
        transform: translateY(110vh);
    }
}
    
    .stars {
    position: fixed;
    inset: 0;

    pointer-events: none;

    opacity: 0;

    transition: opacity 1s;

    z-index: -1;
}

body.star-theme .stars {
    opacity: 1;
}

.stars::before {
    content: "✦  ·  ✧  ·  ⋆  ·  ✦  ·  ✧  ·  ⋆  ·  ✦";

    position: absolute;

    width: 100%;
    height: 100%;

    color: white;

    font-size: 25px;

    line-height: 80px;

    word-spacing: 35px;

    opacity: .7;

    animation: starsMove 8s linear infinite;
}

@keyframes starsMove {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(80px);
    }

}
    
    .moon {
    position: fixed;

    top: 50px;
    right: 70px;

    width: 90px;
    height: 90px;

    border-radius: 50%;

    background: #fff8cf;

    box-shadow:
        0 0 20px #fff8cf,
        0 0 60px rgba(255,248,207,.4);

    opacity: 0;

    transform: scale(.7);

    transition:
        opacity 1s,
        transform 1s;

    pointer-events: none;

    z-index: -1;
}

body.star-theme .moon {
    opacity: 1;

    transform: scale(1);
}
    
    #themeButton {
    position: fixed;

    top: 50px;
    left: 50px;

    z-index: 100;

    padding: 12px 16px;
    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,0.15);
    color: white;

    cursor: pointer;
}
    
    .rain {
    transition: opacity 1s ease;
}

body.star-theme .rain {
    opacity: 0;
}
    
  </style>
</head>
<body>
  
  <div class="card" id="card">

    <div class="cover" id="cover">
        <div class="seal">♥</div>
        <div class="rain"></div>
        <button id="themeButton">🌙</button>
        <div class="stars"></div>
        <div class="moon"></div>
        
        <h1>For Danj</h1>
        <p>♡ Click to open ♡</p>
    </div>


    <!-- LETTER -->
    <div class="letter">

        <div class="letter-decoration">❀</div>

        <div class="date">
            September 3, 2026
        </div>

        <h2>Dear Danj,</h2>

        <p>
            
        </p>

        <p>
            
        </p>

        <p>

        </p>

        <p>
            
        </p>

        <p>
            
        </p>
        
        <img width="150" src="Download/Danj1.jpeg">

        <div class="divider">♡ ───── ❀ ───── ♡</div>

        <p class="ending">
            I love you so much,<br>
            My Danj
        </p>

        <div class="signature">
            Sincerely yours,<br>
            <span>Jakob ♡</span>
        </div>

        <div class="bottom-decoration">
            ✦　♡　✦
        </div>

    </div>

</div>
  
  <script>
  const card = document.getElementById("card");
const cover = document.getElementById("cover");

cover.addEventListener("click", () => {
    card.classList.toggle("open");
});
    
    const rain = document.querySelector(".rain");

for (let i = 0; i < 100; i++) {

    const drop = document.createElement("span");

    drop.classList.add("drop");

    drop.style.left =
        Math.random() * 100 + "%";

    drop.style.animationDuration =
        0.5 + Math.random() * 1 + "s";

    drop.style.animationDelay =
        Math.random() * 2 + "s";

    rain.appendChild(drop);
}
    
    themeButton.addEventListener("click", (event) => {

    event.stopPropagation();

    document.body.classList.toggle("star-theme");

    if (document.body.classList.contains("star-theme")) {
        themeButton.textContent = "🌙";
    } else {
        themeButton.textContent = "🌧️";
    }

});
  </script>
</body>
</html>
