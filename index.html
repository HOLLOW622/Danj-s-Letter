<!DOCTYPE html>
<html>
<head>
  <title>A message for you</title>
  <style>
  
  #clock {
  color: pink;
  text-shadow: 0 0 10px magenta,
               0 0 20px magenta,
               0 0 40px magenta;
}
  
  body {
  background: linear-gradient(
    120deg,
    magenta,
    pink,
    hotpink,
    cyan,
    blue
  );

  background-size: 400% 400%;
  animation: gradient 20s ease infinite;
}

@keyframes gradient {
  0% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0% 50%;
  }
}
  
  .heart {
  color: magenta;
  font-size: 50px;
}
  
  .heart {
  color: hotpink;
  font-size: 50px;
  text-shadow: 0 0 10px pink, 0 0 25px hotpink;
}
  
.heart {
  animation: pulse 1.0s infinite;
}

@keyframes pulse {
  50% {
    transform: scale(1.2);
    opacity: 0.5;
  }
}
  
  .heart {
  font-size: 200px;
}
  
  
  #intro {
  animation: colors 10s infinite;
}

@keyframes colors {
  0% {
    color: cyan;
  }
  
  25% {
    color: blue;
  }

  50% {
    color: magenta;
  }
    
  75% {
    color: pink;
  }

  100% {
    color: hotpink;
  }
}
  
  .button1 {
  background: white;
  color: pink;
  border: 2px hotpink;
  border-radius: 10px;
  padding: 12px 25px;
  font-size: 18px;

  box-shadow: 0 0 50px hotpink;
}

.button1:active {
  background: white;
  color: hotpink;
  box-shadow:
    0 0 10px magenta,
    0 0 30px magenta;
}
  
  .button1:active {
  transform: translateY(5px);
  box-shadow: 0 0 5px hotpink;
}
  
  </style>
</head>
<body>

  <center><h1 id="clock" class="glow"></h1></center>

<script>
function updateClock() {
    let time = new Date();
    document.getElementById("clock").innerHTML = time.toLocaleTimeString();
}

setInterval(updateClock, 1000);
  </script>
  <br><br><br>
  
  <center><h1 id="intro" class="glow"><b>♪ Hi there! I have a message for you! ♪</b></h1></center>

  <center><button class="button1" onclick="window.location.href='letter.html'">
  Click me!
</button></center>
  
  <div class="cursor"></div>
  <br><br>
  <center><div class="heart">♥</div></center>
  <br><br><br>


</body>
</html>
